repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace         # Удаляет лишние пробелы в конце строк
      - id: end-of-file-fixer           # Гарантирует, что файл заканчивается одной пустой строкой
      - id: check-yaml                  # Проверяет синтаксис YAML файлов
      - id: check-toml                  # Проверяет синтаксис TOML файлов
      - id: check-added-large-files     # Предотвращает коммит больших файлов (например, моделей)
        args: ["--maxkb=2500"]
      - id: pretty-format-json          # Автоматически форматирует JSON файлы
        args: [--indent, "2", --autofix, --no-sort-keys]
      - id: check-merge-conflict   # NEW: Запрещает коммитить неразрешенные мердж-конфликты
      - id: check-case-conflict    # NEW: Предотвращает создание файлов, конфликтующих в macOS/Windows (MyFile.txt и myfile.txt)
      - id: debug-statements       # NEW: Предотвращает случайный коммит отладочных операторов (breakpoint(), import pdb)


  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.3
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        args: [--strict, --no-incremental]
        additional_dependencies: ["pydantic", "types-redis", "sqlalchemy-stubs"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks # Ищет секреты (ключи, пароли) в коде

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      - id: hadolint # Линтер для Dockerfile

  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      - id: nbstripout # Очищает вывод ячеек из Jupyter ноутбуков перед коммитом

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.3.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
